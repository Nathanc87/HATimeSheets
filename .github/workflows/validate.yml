name: Validate HATimeSheets

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r timesheet_manager/requirements.txt
      - name: Compile Python
        run: python -m compileall -q timesheet_manager/app
      - name: Run payroll tests
        env:
          PYTHONPATH: timesheet_manager
        run: python -m unittest discover -s timesheet_manager/tests -v
